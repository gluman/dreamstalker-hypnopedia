ragflow:
  base_url: "http://192.168.0.156:9380"
  api_key: ""  # Set via RAGFLOW_API_KEY in .env
  dataset_id: ""  # Set via RAGFLOW_DATASET_ID in .env

audio:
  sample_rate: 44100
  default_duration_hours: 8
  base_binaural_freq: 200.0
  volume: 0.3
  stego:
    method: "phase"
    carrier_freq: 16000.0

sleep_phases:
  wake_to_alpha_min: 30
  alpha_to_theta_min: 60
  cycle_duration_min: 90

tmr:
  enabled: true
  cue_interval_sec: 300
  cue_duration_sec: 2
  cue_freq: 800

paths:
  audio_output: "data/audio"
  sessions: "data/sessions"
  dreams: "data/dreams"
