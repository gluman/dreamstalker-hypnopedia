version: "3.8"

services:
  dreamstalker:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - RAGFLOW_BASE_URL=http://192.168.0.156:9380
      - RAGFLOW_API_KEY=ragflow-UJmyXeAW4Eb6OcWNCxc8oq_Q92CTUbZWGtz2hXHqRq8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/sessions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
